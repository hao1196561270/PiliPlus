name: Build Release

# 推送 main 分支或手动触发时，自动构建 Windows 安装包(.msi) 和 Android 安装包(.apk)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Apply Flutter patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Set and extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release --dart-define-from-file=pili_release.json

      - name: Create MSIX installer (.msi)
        run: dart run msix:create

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: Windows-msi
          path: build/windows/x64/runner/Release/*.msix

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "PiliPlus_windows_portable.zip"

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: Windows-portable
          path: PiliPlus_windows_portable.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Apply Flutter patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set and extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (split per ABI)
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Android-apk
          path: build/app/outputs/flutter-apk/*.apk
